<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- StackLive Logo Mark - Stylized "SL" with dynamic stack effect -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- "S" shape - Stack -->
  <path d="M 14 12 Q 14 8 18 8 L 28 8 Q 32 8 32 12 Q 32 16 28 16 L 20 16 Q 16 16 16 20 Q 16 24 20 24 L 30 24 Q 34 24 34 28" 
        stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- "L" shape - Live -->
  <path d="M 14 32 L 14 44 L 28 44" 
        stroke="url(#logoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Dynamic elements - stacked layers -->
  <rect x="34" y="14" width="8" height="2" fill="url(#logoGradient)" opacity="0.6"/>
  <rect x="34" y="20" width="8" height="2" fill="url(#logoGradient)" opacity="0.8"/>
  <rect x="34" y="26" width="8" height="2" fill="url(#logoGradient)" opacity="1"/>
</svg>
