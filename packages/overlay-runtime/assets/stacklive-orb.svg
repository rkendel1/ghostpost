<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- StackLive Orb - Circular gradient orb with pulsing effect -->
  <defs>
    <radialGradient id="orbGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.6" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring - appears when signal detected -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#orbGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main orb -->
  <circle cx="32" cy="32" r="24" fill="url(#orbGradient)" filter="url(#glow)"/>
  
  <!-- Inner highlight -->
  <circle cx="28" cy="28" r="8" fill="white" opacity="0.3"/>
</svg>
